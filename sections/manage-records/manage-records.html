<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#059669"
    >

    <title>
        إدارة سجلات التسميع والحضور
    </title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="manage-records.css"
    >

</head>

<body>

    <!-- =====================================================
         العنوان
         ===================================================== -->

    <h1>
        📋 إدارة سجلات التسميع والحضور
    </h1>

    <p class="subtitle">
        عرض وتعديل وحذف سجلات الطلاب اليومية
    </p>


    <!-- =====================================================
         البطاقة الرئيسية
         ===================================================== -->

    <div class="card">

        <div
            id="manageRecordsList"
            class="manage-list"
        >

            <div class="loading">
                ⏳ جاري تحميل السجلات...
            </div>

        </div>

    </div>


    <!-- =====================================================
         نافذة تعديل السجل
         ===================================================== -->

    <div
        id="editRecordModal"
        class="modal"
    >

        <div class="modal-content">


            <!-- رأس النافذة -->

            <div class="modal-header">

                <h3>
                    ✏️ تعديل بيانات السجل
                </h3>

                <button
                    type="button"
                    class="modal-close"
                    id="closeModalBtn"
                    aria-label="إغلاق"
                >
                    &times;
                </button>

            </div>


            <!-- محتوى النافذة -->

            <div class="modal-body">


                <!-- ID السجل -->

                <input
                    type="hidden"
                    id="editRecordId"
                >


                <!-- الطالب -->

                <div class="form-group">

                    <label for="editRecordStudentName">
                        👨‍🎓 الطالب:
                    </label>

                    <input
                        type="text"
                        id="editRecordStudentName"
                        readonly
                    >

                </div>


                <!-- الحلقة -->

                <div class="form-group">

                    <label for="editRecordHalaqaName">
                        📖 الحلقة:
                    </label>

                    <input
                        type="text"
                        id="editRecordHalaqaName"
                        readonly
                    >

                </div>


                <!-- التاريخ -->

                <div class="form-group">

                    <label for="editRecordDate">
                        📅 التاريخ:
                    </label>

                    <input
                        type="text"
                        id="editRecordDate"
                        readonly
                    >

                </div>


                <!-- =================================================
                     حالة الحضور
                     ================================================= -->

                <div class="form-group">

                    <label for="editRecordStatus">
                        📌 حالة الحضور:
                    </label>

                    <select
                        id="editRecordStatus"
                    >

                        <option value="حاضر">
                            ✅ حاضر
                        </option>

                        <option value="غائب">
                            ❌ غائب
                        </option>

                        <option value="إجازة">
                            🔵 إجازة
                        </option>

                        <option value="مستأذن">
                            🟠 مستأذن
                        </option>

                    </select>

                </div>


                <!-- =================================================
                     بيانات التسميع
                     تظهر فقط عند حالة حاضر
                     ================================================= -->

                <div
                    id="recordSurahFields"
                >


                    <!-- السورة -->

                    <div class="form-group">

                        <label for="editRecordSurah">
                            📖 السورة:
                        </label>

                        <input
                            type="text"
                            id="editRecordSurah"
                            placeholder="اسم السورة"
                        >

                    </div>


                    <!-- الآيات -->

                    <div class="grid-inputs">


                        <div class="form-group">

                            <label for="editRecordFromAyah">
                                من آية:
                            </label>

                            <input
                                type="number"
                                id="editRecordFromAyah"
                                min="0"
                                inputmode="numeric"
                                placeholder="مثال: 1"
                            >

                        </div>


                        <div class="form-group">

                            <label for="editRecordToAyah">
                                إلى آية:
                            </label>

                            <input
                                type="number"
                                id="editRecordToAyah"
                                min="0"
                                inputmode="numeric"
                                placeholder="مثال: 10"
                            >

                        </div>


                    </div>


                    <!-- =================================================
                         التقييم
                         ================================================= -->

                    <div class="form-group">

                        <label>
                            ⭐ التقييم:
                        </label>


                        <div class="evaluation-grid">


                            <label class="evaluation-option">

                                <input
                                    type="checkbox"
                                    class="eval-check"
                                    value="حفظ"
                                >

                                <span>
                                    📗 حفظ
                                </span>

                            </label>


                            <label class="evaluation-option">

                                <input
                                    type="checkbox"
                                    class="eval-check"
                                    value="إتقان"
                                >

                                <span>
                                    ⭐ إتقان
                                </span>

                            </label>


                            <label class="evaluation-option">

                                <input
                                    type="checkbox"
                                    class="eval-check"
                                    value="تجويد"
                                >

                                <span>
                                    🎯 تجويد
                                </span>

                            </label>


                            <label class="evaluation-option">

                                <input
                                    type="checkbox"
                                    class="eval-check"
                                    value="مراجعة"
                                >

                                <span>
                                    🔄 مراجعة
                                </span>

                            </label>


                        </div>

                    </div>


                    <!-- =================================================
                         المطلوب غداً
                         ================================================= -->

                    <div class="form-group">

                        <label for="editRecordTomorrowRequirement">
                            📅 المطلوب غداً:
                        </label>

                        <input
                            type="text"
                            id="editRecordTomorrowRequirement"
                            placeholder="مثال: سورة البقرة من آية 20 إلى 30"
                        >

                    </div>


                    <!-- =================================================
                         ملاحظات الشيخ
                         ================================================= -->

                    <div class="form-group">

                        <label for="editRecordNotes">
                            📝 ملاحظات الشيخ:
                        </label>

                        <textarea
                            id="editRecordNotes"
                            rows="3"
                            placeholder="اكتب ملاحظات الشيخ..."
                        ></textarea>

                    </div>


                </div>


                <!-- =================================================
                     النقاط
                     ================================================= -->

                <div class="form-group">

                    <label for="editRecordPoints">
                        ⭐ النقاط:
                    </label>

                    <input
                        type="number"
                        id="editRecordPoints"
                        min="0"
                        step="1"
                        inputmode="numeric"
                    >

                    <small class="field-hint">
                        الحضور غير الفعلي لا يحصل على نقاط.
                    </small>

                </div>


                <!-- =================================================
                     الأسطر
                     ================================================= -->

                <div class="form-group">

                    <label for="editRecordLines">
                        📖 الأسطر:
                    </label>

                    <input
                        type="number"
                        id="editRecordLines"
                        min="0"
                        step="1"
                        inputmode="numeric"
                    >

                </div>


            </div>


            <!-- =================================================
                 أزرار النافذة
                 ================================================= -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-cancel"
                    id="cancelEditBtn"
                >
                    إلغاء
                </button>

                <button
                    type="button"
                    class="btn-save"
                    id="saveRecordBtn"
                >
                    💾 حفظ التعديلات
                </button>

            </div>


        </div>

    </div>


    <!-- =====================================================
         JavaScript
         ===================================================== -->

    <script
        type="module"
        src="manage-records.js"
    ></script>

</body>

</html>
