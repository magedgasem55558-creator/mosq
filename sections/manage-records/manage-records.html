<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#059669">

    <title>إدارة سجلات التسميع</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="manage-records.css">
</head>

<body>

    <!-- ==============================
         رأس الصفحة
    =============================== -->
    <header class="page-header">

        <div class="header-icon">
            📋
        </div>

        <div>
            <h1>إدارة سجلات التسميع</h1>
            <p class="subtitle">
                عرض وتعديل وحذف سجلات الطلاب
            </p>
        </div>

    </header>


    <!-- ==============================
         الإحصائيات
    =============================== -->
    <section class="stats-grid">

        <!-- إجمالي السجلات -->
        <div class="stat-card total">

            <div class="stat-icon">
                📊
            </div>

            <div class="stat-content">
                <span class="stat-label">
                    إجمالي السجلات
                </span>

                <strong id="totalRecordsCount">
                    0
                </strong>
            </div>

        </div>


        <!-- حاضر -->
        <div class="stat-card present">

            <div class="stat-icon">
                ✅
            </div>

            <div class="stat-content">
                <span class="stat-label">
                    حاضر
                </span>

                <strong id="presentRecordsCount">
                    0
                </strong>
            </div>

        </div>


        <!-- مستأذن -->
        <div class="stat-card excused">

            <div class="stat-icon">
                🟡
            </div>

            <div class="stat-content">
                <span class="stat-label">
                    مستأذن
                </span>

                <strong id="excusedRecordsCount">
                    0
                </strong>
            </div>

        </div>


        <!-- إجازة -->
        <div class="stat-card vacation">

            <div class="stat-icon">
                🔵
            </div>

            <div class="stat-content">
                <span class="stat-label">
                    إجازة
                </span>

                <strong id="vacationRecordsCount">
                    0
                </strong>
            </div>

        </div>


        <!-- غائب -->
        <div class="stat-card absent">

            <div class="stat-icon">
                ❌
            </div>

            <div class="stat-content">
                <span class="stat-label">
                    غائب
                </span>

                <strong id="absentRecordsCount">
                    0
                </strong>
            </div>

        </div>

    </section>


    <!-- ==============================
         بطاقة السجلات
    =============================== -->
    <main class="card">

        <!-- أدوات البحث -->
        <div class="records-toolbar">

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    id="recordSearchInput"
                    placeholder="ابحث باسم الطالب أو السورة..."
                    autocomplete="off"
                >

            </div>


            <!-- فلترة الحالة -->
            <div class="filter-box">

                <select id="recordStatusFilter">

                    <option value="all">
                        جميع الحالات
                    </option>

                    <option value="حاضر">
                        ✅ حاضر
                    </option>

                    <option value="مستأذن">
                        🟡 مستأذن
                    </option>

                    <option value="إجازة">
                        🔵 إجازة
                    </option>

                    <option value="غائب">
                        ❌ غائب
                    </option>

                </select>

            </div>

        </div>


        <!-- عنوان القائمة -->
        <div class="list-header">

            <div>
                <h2>
                    سجلات التسميع
                </h2>

                <span id="visibleRecordsCount">
                    0 سجل
                </span>
            </div>

        </div>


        <!-- قائمة السجلات -->
        <div
            id="manageRecordsList"
            class="manage-list"
        >

            <div class="loading">

                <div class="loading-spinner"></div>

                <span>
                    جاري تحميل السجلات...
                </span>

            </div>

        </div>

    </main>


    <!-- ==============================
         نافذة تعديل السجل
    =============================== -->
    <div
        id="editRecordModal"
        class="modal"
        aria-hidden="true"
    >

        <div class="modal-content">

            <!-- رأس النافذة -->
            <div class="modal-header">

                <div>

                    <span class="modal-title-icon">
                        ✏️
                    </span>

                    <h3>
                        تعديل بيانات السجل
                    </h3>

                </div>

                <button
                    type="button"
                    class="modal-close"
                    id="closeModalBtn"
                    aria-label="إغلاق"
                >
                    ×
                </button>

            </div>


            <!-- محتوى النافذة -->
            <div class="modal-body">

                <input
                    type="hidden"
                    id="editRecordId"
                >


                <!-- الطالب -->
                <div class="form-group">

                    <label for="editRecordStudentName">
                        👨‍🎓 الطالب
                    </label>

                    <input
                        type="text"
                        id="editRecordStudentName"
                        readonly
                    >

                </div>


                <!-- التاريخ -->
                <div class="form-group">

                    <label for="editRecordDate">
                        📅 التاريخ
                    </label>

                    <input
                        type="text"
                        id="editRecordDate"
                        readonly
                    >

                </div>


                <!-- الحالة -->
                <div class="form-group">

                    <label for="editRecordStatus">
                        📌 حالة الطالب
                    </label>

                    <select id="editRecordStatus">

                        <option value="حاضر">
                            ✅ حاضر
                        </option>

                        <option value="مستأذن">
                            🟡 مستأذن
                        </option>

                        <option value="إجازة">
                            🔵 إجازة
                        </option>

                        <option value="غائب">
                            ❌ غائب
                        </option>

                    </select>

                </div>


                <!-- بيانات التسميع -->
                <div id="recordSurahFields">

                    <div class="section-title">
                        📖 بيانات التسميع
                    </div>


                    <!-- السورة -->
                    <div class="form-group">

                        <label for="editRecordSurah">
                            السورة
                        </label>

                        <input
                            type="text"
                            id="editRecordSurah"
                            placeholder="اسم السورة"
                        >

                    </div>


                    <!-- الآيات -->
                    <div class="grid-inputs">

                        <div class="form-group">

                            <label for="editRecordFromAyah">
                                من آية
                            </label>

                            <input
                                type="number"
                                id="editRecordFromAyah"
                                min="0"
                            >

                        </div>


                        <div class="form-group">

                            <label for="editRecordToAyah">
                                إلى آية
                            </label>

                            <input
                                type="number"
                                id="editRecordToAyah"
                                min="0"
                            >

                        </div>

                    </div>

                </div>


                <!-- النقاط والأسطر -->
                <div class="grid-inputs">

                    <div class="form-group">

                        <label for="editRecordPoints">
                            ⭐ النقاط
                        </label>

                        <input
                            type="number"
                            id="editRecordPoints"
                            min="0"
                            step="1"
                        >

                    </div>


                    <div class="form-group">

                        <label for="editRecordLines">
                            📖 الأسطر
                        </label>

                        <input
                            type="number"
                            id="editRecordLines"
                            min="0"
                            step="1"
                        >

                    </div>

                </div>

            </div>


            <!-- أزرار النافذة -->
            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-cancel"
                    id="cancelEditBtn"
                >
                    إلغاء
                </button>

                <button
                    type="button"
                    class="btn-save"
                    id="saveRecordBtn"
                >
                    💾 حفظ التعديلات
                </button>

            </div>

        </div>

    </div>


    <!-- ==============================
         JavaScript
    =============================== -->
    <script
        type="module"
        src="manage-records.js"
    ></script>

</body>

</html>
