<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#059669">

    <title>إدارة سجلات التسميع</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="manage-records.css">
</head>

<body>

    <!-- =====================================================
         العنوان
    ====================================================== -->

    <header class="page-header">

        <div class="header-icon">
            📋
        </div>

        <div>
            <h1>إدارة سجلات التسميع</h1>

            <p class="subtitle">
                عرض وتعديل وحذف سجلات التسميع والحضور
            </p>
        </div>

    </header>


    <!-- =====================================================
         البطاقة الرئيسية
    ====================================================== -->

    <main class="card">

        <div class="card-header">

            <div>

                <h2>
                    📚 سجلات الطلاب
                </h2>

                <p>
                    يمكنك تعديل بيانات أي سجل أو حذفه
                </p>

            </div>

            <div class="records-badge">
                📊 السجلات
            </div>

        </div>


        <!-- قائمة السجلات -->

        <div
            id="manageRecordsList"
            class="manage-list"
        >

            <div class="loading">

                <div class="loading-spinner"></div>

                <span>
                    جاري تحميل السجلات...
                </span>

            </div>

        </div>

    </main>


    <!-- =====================================================
         نافذة تعديل السجل
    ====================================================== -->

    <div
        id="editRecordModal"
        class="modal"
    >

        <div class="modal-content">


            <!-- رأس النافذة -->

            <div class="modal-header">

                <div class="modal-title">

                    <div class="modal-icon">
                        ✏️
                    </div>

                    <div>

                        <h3>
                            تعديل بيانات السجل
                        </h3>

                        <span>
                            تعديل رصد الطالب لهذا اليوم
                        </span>

                    </div>

                </div>

                <button
                    type="button"
                    class="modal-close"
                    id="closeModalBtn"
                    aria-label="إغلاق"
                >
                    &times;
                </button>

            </div>


            <!-- جسم النافذة -->

            <div class="modal-body">

                <input
                    type="hidden"
                    id="editRecordId"
                >


                <!-- الطالب -->

                <div class="form-group">

                    <label for="editRecordStudentName">
                        👨‍🎓 الطالب
                    </label>

                    <input
                        type="text"
                        id="editRecordStudentName"
                        readonly
                    >

                </div>


                <!-- التاريخ -->

                <div class="form-group">

                    <label for="editRecordDate">
                        📅 التاريخ
                    </label>

                    <input
                        type="text"
                        id="editRecordDate"
                        readonly
                    >

                </div>


                <!-- الحالة -->

                <div class="form-group">

                    <label for="editRecordStatus">
                        📌 حالة الحضور
                    </label>

                    <select
                        id="editRecordStatus"
                    >

                        <option value="حاضر">
                            ✅ حاضر
                        </option>

                        <option value="غائب">
                            ❌ غائب
                        </option>

                        <option value="إجازة">
                            🔵 إجازة
                        </option>

                        <option value="مستأذن">
                            🟠 مستأذن
                        </option>

                    </select>

                </div>


                <!-- بيانات التسميع -->

                <div
                    id="recordSurahFields"
                    class="recitation-section"
                >

                    <div class="section-title">

                        <span>
                            📖 بيانات التسميع
                        </span>

                        <small>
                            تظهر عند اختيار حالة حاضر
                        </small>

                    </div>


                    <!-- السورة -->

                    <div class="form-group">

                        <label for="editRecordSurah">
                            📖 السورة
                        </label>

                        <input
                            type="text"
                            id="editRecordSurah"
                            placeholder="مثال: سورة البقرة"
                        >

                    </div>


                    <!-- الآيات -->

                    <div class="grid-inputs">

                        <div class="form-group">

                            <label for="editRecordFromAyah">
                                🔹 من آية
                            </label>

                            <input
                                type="number"
                                id="editRecordFromAyah"
                                min="0"
                                placeholder="رقم الآية"
                            >

                        </div>


                        <div class="form-group">

                            <label for="editRecordToAyah">
                                🔹 إلى آية
                            </label>

                            <input
                                type="number"
                                id="editRecordToAyah"
                                min="0"
                                placeholder="رقم الآية"
                            >

                        </div>

                    </div>

                </div>


                <!-- النقاط -->

                <div class="form-group">

                    <label for="editRecordPoints">
                        ⭐ النقاط
                    </label>

                    <input
                        type="number"
                        id="editRecordPoints"
                        min="0"
                        step="1"
                        placeholder="عدد النقاط"
                    >

                </div>


                <!-- الأسطر -->

                <div class="form-group">

                    <label for="editRecordLines">
                        📖 الأسطر
                    </label>

                    <input
                        type="number"
                        id="editRecordLines"
                        min="0"
                        step="1"
                        placeholder="عدد الأسطر"
                    >

                </div>

            </div>


            <!-- أزرار النافذة -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-cancel"
                    id="cancelEditBtn"
                >
                    <span>↩️</span>
                    إلغاء
                </button>

                <button
                    type="button"
                    class="btn-save"
                    id="saveRecordBtn"
                >
                    <span>💾</span>
                    حفظ التعديلات
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script
        type="module"
        src="manage-records.js"
    ></script>

</body>

</html>
