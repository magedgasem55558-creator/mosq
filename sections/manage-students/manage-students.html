<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="manage-students.css">
</head>
<body>
 <h1>📋 إدارة الطلاب</h1>
<p class="subtitle">إدارة بيانات الطلاب ومتابعة حالة النشاط</p><!-- إحصائيات الطلاب --><div class="students-stats"><div class="stat-card stat-total">
    <div class="stat-icon">👨‍🎓</div>
    <div class="stat-info">
        <span class="stat-number" id="totalStudentsCount">0</span>
        <span class="stat-label">إجمالي الطلاب</span>
    </div>
</div>

<div class="stat-card stat-active">
    <div class="stat-icon">🟢</div>
    <div class="stat-info">
        <span class="stat-number" id="activeStudentsCount">0</span>
        <span class="stat-label">الطلاب النشطين</span>
    </div>
</div>

<div class="stat-card stat-inactive">
    <div class="stat-icon">🔴</div>
    <div class="stat-info">
        <span class="stat-number" id="inactiveStudentsCount">0</span>
        <span class="stat-label">غير النشطين</span>
    </div>
</div>

</div><!-- شريط الأدوات --><div class="students-toolbar"><div class="search-wrapper">
    <span class="search-icon">🔍</span>

    <input
        type="search"
        id="studentSearchInput"
        placeholder="ابحث باسم الطالب..."
        autocomplete="off"
    >
</div>

<button id="resetAllPointsBtn" class="btn-warning">
    🔄 تصفير نقاط الجميع
</button>

</div><!-- قائمة الطلاب --><div id="manageStudentsList" class="manage-list">
    <div class="loading">جاري تحميل الطلاب...</div>
</div>

    <!-- نافذة تعديل الطالب -->
    <div id="editStudentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ تعديل بيانات الطالب</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editStudentId">
                <div class="form-group">
                    <label>👨‍🎓 اسم الطالب:</label>
                    <input type="text" id="editStudentName">
                </div>
                <div class="form-group">
                    <label>🏫 الحلقة:</label>
                    <select id="editStudentHalaqa">
                        <option value="">اختر الحلقة...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>⭐ النقاط:</label>
                    <input type="number" id="editStudentPoints" step="1">
                </div>
                <div class="form-group">
                    <label>✅ الحالة:</label>
                    <select id="editStudentStatus">
                        <option value="true">نشط</option>
                        <option value="false">غير نشط</option>
                    </select>
                </div>
                <hr>
                <h4>👨‍👩‍👦 بيانات ولي الأمر</h4>
                <div class="form-group">
                    <label>📧 البريد الإلكتروني:</label>
                    <input type="email" id="editParentEmail" readonly>
                    <small style="color:#6b7280;">(للتذكير فقط – لا يمكن تغييره هنا)</small>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelEditBtn">إلغاء</button>
                <button class="btn-save" id="saveStudentBtn">💾 حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <script type="module" src="manage-students.js"></script>
</body>
</html>
