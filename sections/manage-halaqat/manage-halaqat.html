<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="manage-halaqat.css">
</head>
<body>
    <h1>📋 إدارة الحلقات</h1>
    <p class="subtitle">تعديل أو حذف الحلقات القرآنية</p>
    <div class="card">
        <div id="manageHalaqatList" class="manage-list">
            <div class="loading">جاري التحميل...</div>
        </div>
    </div>

    <!-- نافذة تعديل الحلقة -->
    <div id="editHalaqaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ تعديل بيانات الحلقة</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editHalaqaId">
                <div class="form-group">
                    <label>🏫 اسم الحلقة:</label>
                    <input type="text" id="editHalaqaName" placeholder="اسم الحلقة">
                </div>
                <div class="form-group">
                    <label>👨‍🏫 اسم الشيخ:</label>
                    <input type="text" id="editTeacherName" placeholder="اسم المدرس">
                </div>
                <div class="form-group">
                    <label>📞 رقم واتساب المدرس:</label>
                    <input type="text" id="editTeacherPhone" placeholder="رقم الهاتف">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelEditBtn">إلغاء</button>
                <button class="btn-save" id="saveHalaqaBtn">💾 حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <script type="module" src="manage-halaqat.js"></script>
</body>
</html>
