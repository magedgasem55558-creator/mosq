<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="khutba.css">
</head>
<body>
    <h1>🕌 إعلان خطبة الجمعة القادمة</h1>
    <div class="card">
        <label>عنوان الخطبة:</label>
        <input type="text" id="khutbaTitle" placeholder="مثلاً: بر الوالدين وأثره في الرزق">
        <label>اسم الخطيب:</label>
        <input type="text" id="khutbaImam" placeholder="الشيخ: فلان بن فلان">
        <button id="updateBtn" class="btn-primary">📝 تحديث بيانات الخطبة</button>
        <button id="deleteBtn" class="btn-danger">🗑️ حذف الخطبة</button>
    </div>
    <script type="module" src="khutba.js"></script>
</body>
</html>
