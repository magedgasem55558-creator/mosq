<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة طالب وولي أمر</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="students.css">
</head>
<body>
    <h1>👥 إضافة طالب وولي أمر</h1>
    <p class="subtitle">📌 لإضافة أخ لنفس الحساب، استخدم نفس البريد الإلكتروني وكلمة المرور</p>
    
    <form id="addStudentForm" class="card" onsubmit="return false;">
        <div class="section-badge">📖 بيانات الطالب</div>
        <input type="text" id="studentName" placeholder="اسم الطالب الرباعي" required>
        
        <label for="halaqaSelect">اختر الحلقة:</label>
        <select id="halaqaSelect" required>
            <option value="">جاري التحميل...</option>
        </select>
        
        <hr>
        
        <div class="section-badge">👨‍👩‍👦 حساب ولي الأمر</div>
        <input type="email" id="parentEmail" placeholder="البريد الإلكتروني" required>
        <input type="password" id="parentPass" placeholder="كلمة المرور" required>
        
        <button type="button" id="addBtn" class="btn-save">✅ حفظ البيانات</button>
    </form>

    <script type="module" src="students.js"></script>
</body>
</html>
