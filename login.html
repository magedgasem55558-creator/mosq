<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المسجد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at 30% 20%, #065f46 0%, #022c22 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%);
            top: -200px;
            right: -150px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            border-radius: 50%;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem 2rem;
            border-radius: 2rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(212,175,55,0.3);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: floatIn 0.6s ease-out;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #065f46, #047857);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }
        .login-card p {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .input-icon {
            position: relative;
            margin: 12px 0;
        }
        .input-icon span {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
        }
        input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 1rem;
            font-size: 1rem;
            transition: 0.3s;
            background: #f9fafb;
        }
        input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.1);
            background: white;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #065f46, #047857);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0 8px 25px rgba(6,95,70,0.35);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(6,95,70,0.5);
        }
        .error-msg {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px;
            border-radius: 0.8rem;
            margin-top: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🏛️ مرحباً بك</h1>
        <p>سجل دخولك بحسابك الإداري</p>
        <div class="input-icon"><span>📧</span><input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="email"></div>
        <div class="input-icon"><span>🔐</span><input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password"></div>
        <button id="loginBtn">🚪 دخول إلى لوحة التحكم</button>
        <div id="errorMsg" class="error-msg"></div>
        <div class="footer-note">🔐 نظام محمي للمسؤولين فقط</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC06KKxkehT1uPBT9k-r-d6MmB4RUuVy9Y",
            authDomain: "mosque-system.firebaseapp.com",
            projectId: "mosque-system",
            storageBucket: "mosque-system.firebasestorage.app",
            messagingSenderId: "905816133159",
            appId: "1:905816133159:web:3b95d858815f91780e0802"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'index.html'; });

        window.loginWithEmail = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.style.display = 'none';
            if (!email || !password) {
                errorDiv.innerText = '⚠️ الرجاء إدخال البريد وكلمة المرور';
                errorDiv.style.display = 'block';
                return;
            }
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'admin') {
                    window.location.href = 'index.html';
                } else {
                    await signOut(auth);
                    errorDiv.innerText = '⛔ لا تملك صلاحية الدخول.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                let message = 'فشل تسجيل الدخول.';
                if (error.code === 'auth/user-not-found') message = '❌ لا يوجد حساب بهذا البريد.';
                if (error.code === 'auth/wrong-password') message = '❌ كلمة مرور غير صحيحة.';
                if (error.code === 'auth/too-many-requests') message = '🚫 تم تعطيل الحساب مؤقتاً.';
                errorDiv.innerText = message;
                errorDiv.style.display = 'block';
            }
        };

        document.getElementById('loginBtn').addEventListener('click', window.loginWithEmail);
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.loginWithEmail(); });
        });
    </script>
</body>
</html>
