<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة المسجد</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-card h1 {
            color: #065f46;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .login-card p {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.85rem;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 1rem;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
        }
        button {
            width: 100%;
            background-color: #059669;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #047857;
            transform: translateY(-2px);
        }
        .error-msg {
            color: #dc2626;
            background: #fee2e2;
            padding: 10px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 0.85rem;
            display: none;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🏛️ مرحباً بك</h1>
        <p>سجل دخولك بحسابك الإداري للمتابعة</p>
        
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password">
        
        <button id="loginBtn">دخول إلى لوحة التحكم</button>
        
        <div id="errorMsg" class="error-msg"></div>
        <div class="footer-note">🔐 هذا النظام محمي، فقط الحسابات المصرح لها يمكنها الدخول</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC06KKxkehT1uPBT9k-r-d6MmB4RUuVy9Y",
            authDomain: "mosque-system.firebaseapp.com",
            projectId: "mosque-system",
            storageBucket: "mosque-system.firebasestorage.app",
            messagingSenderId: "905816133159",
            appId: "1:905816133159:web:3b95d858815f91780e0802"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        window.loginWithEmail = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('errorMsg');
            
            errorDiv.style.display = 'none';
            
            if (!email || !password) {
                errorDiv.innerText = '⚠️ الرجاء إدخال البريد الإلكتروني وكلمة المرور';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === 'admin') {
                    window.location.href = 'index.html';
                } else {
                    await signOut(auth);
                    errorDiv.innerText = '⛔ هذا الحساب ليس لديه صلاحية الدخول إلى لوحة التحكم.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                let message = 'فشل تسجيل الدخول. تأكد من بياناتك.';
                if (error.code === 'auth/user-not-found') message = '❌ لا يوجد حساب بهذا البريد.';
                if (error.code === 'auth/wrong-password') message = '❌ كلمة المرور غير صحيحة.';
                if (error.code === 'auth/too-many-requests') message = '🚫 تم تعطيل الحساب مؤقتاً. حاول لاحقاً.';
                errorDiv.innerText = message;
                errorDiv.style.display = 'block';
            }
        };

        document.getElementById('loginBtn').addEventListener('click', window.loginWithEmail);
        
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') window.loginWithEmail();
            });
        });
    </script>
</body>
</html>
